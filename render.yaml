services:
  - type: web
    name: shopverse-marketplace
    env: node
    plan: free
    buildCommand: npm install --prefix server --production=false && npm install --prefix client --production=false && npm run build --prefix client
    startCommand: node server/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
