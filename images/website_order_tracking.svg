<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="trackShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Topbar -->
  <rect x="0" y="0" width="1000" height="50" fill="#1e293b" />
  <text x="30" y="32" fill="#3b82f6" font-size="20" font-weight="800">Shop<tspan fill="#f59e0b">Verse</tspan> <tspan fill="#94a3b8" font-size="13" font-weight="500">| Customer Order Details &amp; Live Tracking</tspan></text>
  <text x="960" y="32" text-anchor="end" fill="#cbd5e1" font-size="12">Customer: Rahul Verma</text>

  <!-- Main Card -->
  <rect x="50" y="75" width="900" height="415" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#trackShadow)" />

  <!-- Order Header -->
  <rect x="50" y="75" width="900" height="60" rx="12" fill="#0f172a" />
  <text x="80" y="105" fill="#f8fafc" font-size="16" font-weight="700">Order #ORD-20261114-620817</text>
  <text x="80" y="123" fill="#94a3b8" font-size="11">Placed on 14 Nov 2026, 07:48 PM • Multi-Vendor Order (2 Sellers)</text>
  <rect x="760" y="90" width="160" height="30" rx="6" fill="#1e3a8a" />
  <text x="840" y="110" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">MASTER: SHIPPED 🚚</text>

  <!-- Real-time Live Tracking Stepper -->
  <g transform="translate(100, 160)">
    <line x1="80" y1="25" x2="640" y2="25" stroke="#334155" stroke-width="4" />
    <line x1="80" y1="25" x2="440" y2="25" stroke="#10b981" stroke-width="4" />

    <!-- Step 1: Confirmed -->
    <circle cx="80" cy="25" r="16" fill="#10b981" />
    <text x="80" y="30" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">✓</text>
    <text x="80" y="60" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Order Confirmed</text>
    <text x="80" y="75" text-anchor="middle" fill="#94a3b8" font-size="10">07:48 PM</text>

    <!-- Step 2: Processing -->
    <circle cx="260" cy="25" r="16" fill="#10b981" />
    <text x="260" y="30" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">✓</text>
    <text x="260" y="60" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Processing</text>
    <text x="260" y="75" text-anchor="middle" fill="#94a3b8" font-size="10">07:49 PM</text>

    <!-- Step 3: Shipped -->
    <circle cx="440" cy="25" r="16" fill="#3b82f6" />
    <text x="440" y="30" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">●</text>
    <text x="440" y="60" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Shipped</text>
    <text x="440" y="75" text-anchor="middle" fill="#38bdf8" font-size="10">07:50 PM (Live)</text>

    <!-- Step 4: Out for Delivery -->
    <circle cx="620" cy="25" r="16" fill="#334155" />
    <text x="620" y="30" text-anchor="middle" fill="#64748b" font-size="11">○</text>
    <text x="620" y="60" text-anchor="middle" fill="#64748b" font-size="12">Out for Delivery</text>
    <text x="620" y="75" text-anchor="middle" fill="#475569" font-size="10">Pending</text>
  </g>

  <!-- Itemized Multi-Vendor Breakdown -->
  <text x="80" y="275" fill="#f8fafc" font-size="14" font-weight="700">Itemized Multi-Vendor Fulfillment Status (Real-time Socket.IO)</text>

  <!-- Item 1: Vendor 1 -->
  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="400" height="90" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="20" y="26" fill="#c4b5fd" font-size="13" font-weight="bold">Vendor: Fashion Aura &amp; Apparels</text>
    <text x="20" y="48" fill="#f8fafc" font-size="12">Full-Grain Leather Wedge Sandals (x1)</text>
    <text x="20" y="68" fill="#38bdf8" font-size="12" font-weight="bold">Price: ₹1,299</text>
    <rect x="275" y="48" width="105" height="24" rx="12" fill="#854d0e" />
    <text x="327" y="64" text-anchor="middle" fill="#fde047" font-size="10" font-weight="bold">PROCESSING ⚙️</text>
  </g>

  <!-- Item 2: Vendor 2 -->
  <g transform="translate(520, 290)">
    <rect x="0" y="0" width="400" height="90" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="20" y="26" fill="#fde68a" font-size="13" font-weight="bold">Vendor: ElectroTech Gadgets</text>
    <text x="20" y="48" fill="#f8fafc" font-size="12">Low-Profile Grip Board Skate Shoes (x1)</text>
    <text x="20" y="68" fill="#38bdf8" font-size="12" font-weight="bold">Price: ₹1,199</text>
    <rect x="275" y="48" width="105" height="24" rx="12" fill="#1e3a8a" />
    <text x="327" y="64" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">SHIPPED 🚚</text>
  </g>

  <!-- Order Footer Summary -->
  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="840" height="70" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="20" y="26" fill="#94a3b8" font-size="11">SHIPPING ADDRESS</text>
    <text x="20" y="46" fill="#cbd5e1" font-size="11">42 MG Road, 3rd Floor, Indiranagar, Bengaluru - 560038</text>

    <text x="440" y="26" fill="#94a3b8" font-size="11">PAYMENT &amp; TOTAL</text>
    <text x="440" y="46" fill="#cbd5e1" font-size="11">Simulated Card • Subtotal: ₹2,498 + Delivery: Free (Above ₹1,000)</text>

    <text x="740" y="32" fill="#94a3b8" font-size="11">GRAND TOTAL</text>
    <text x="740" y="52" fill="#10b981" font-size="16" font-weight="bold">₹2,498</text>
  </g>
</svg>
