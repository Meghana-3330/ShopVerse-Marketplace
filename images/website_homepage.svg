<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Browser Chrome Topbar -->
  <rect x="0" y="0" width="1000" height="35" fill="#1e293b" />
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <rect x="180" y="7" width="640" height="22" rx="5" fill="#0f172a" />
  <text x="500" y="22" text-anchor="middle" fill="#94a3b8" font-size="11">https://shopverse-marketplace.onrender.com</text>

  <!-- Navbar -->
  <rect x="0" y="35" width="1000" height="60" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="30" y="73" fill="#3b82f6" font-size="22" font-weight="800" letter-spacing="-0.5">Shop<tspan fill="#f59e0b">Verse</tspan></text>
  <rect x="180" y="48" width="400" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="210" y="70" fill="#94a3b8" font-size="12">Search 168+ products across 8 categories...</text>
  <text x="630" y="70" fill="#cbd5e1" font-size="13" font-weight="500">Categories</text>
  <text x="720" y="70" fill="#cbd5e1" font-size="13" font-weight="500">Deals</text>
  <rect x="780" y="48" width="85" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
  <text x="822" y="70" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">🔔 (3)</text>
  <rect x="880" y="48" width="95" height="34" rx="8" fill="#2563eb" />
  <text x="927" y="70" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">🛒 Cart (2)</text>

  <!-- Hero Section -->
  <rect x="30" y="110" width="940" height="150" rx="12" fill="url(#heroGrad)" filter="url(#cardShadow)" />
  <text x="60" y="155" fill="#fde047" font-size="12" font-weight="700" letter-spacing="1.5">MEGA MULTI-VENDOR MARKETPLACE</text>
  <text x="60" y="195" fill="#ffffff" font-size="26" font-weight="800">Shop From Verified Independent Merchants</text>
  <text x="60" y="225" fill="#cbd5e1" font-size="13">168 curated products in Fashion, Electronics, Home, Beauty &amp; more with unified checkout.</text>
  <rect x="780" y="185" width="160" height="42" rx="8" fill="#f59e0b" />
  <text x="860" y="211" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Explore Catalog ➔</text>

  <!-- Categories Bar -->
  <text x="30" y="290" fill="#f8fafc" font-size="16" font-weight="700">Explore Popular Categories (21 items each)</text>
  <g transform="translate(30, 305)">
    <!-- Cat 1 -->
    <rect x="0" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="52" y="27" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">👗 Fashion</text>
    <!-- Cat 2 -->
    <rect x="120" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="172" y="27" text-anchor="middle" fill="#cbd5e1" font-size="12">💻 Electronics</text>
    <!-- Cat 3 -->
    <rect x="240" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="292" y="27" text-anchor="middle" fill="#cbd5e1" font-size="12">🍳 Home</text>
    <!-- Cat 4 -->
    <rect x="360" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="412" y="27" text-anchor="middle" fill="#cbd5e1" font-size="12">💄 Beauty</text>
    <!-- Cat 5 -->
    <rect x="480" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="532" y="27" text-anchor="middle" fill="#cbd5e1" font-size="12">📚 Books</text>
    <!-- Cat 6 -->
    <rect x="600" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="652" y="27" text-anchor="middle" fill="#cbd5e1" font-size="12">⚽ Sports</text>
    <!-- Cat 7 -->
    <rect x="720" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="772" y="27" text-anchor="middle" fill="#cbd5e1" font-size="12">⌚ Accessories</text>
    <!-- Cat 8 -->
    <rect x="840" y="0" width="100" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="890" y="27" text-anchor="middle" fill="#cbd5e1" font-size="12">👟 Footwear</text>
  </g>

  <!-- Product Cards Grid -->
  <text x="30" y="380" fill="#f8fafc" font-size="16" font-weight="700">Trending Marketplace Products</text>

  <!-- Card 1 -->
  <g transform="translate(30, 395)">
    <rect x="0" y="0" width="220" height="205" rx="10" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="220" height="100" rx="10" fill="#334155" />
    <text x="110" y="55" text-anchor="middle" fill="#94a3b8" font-size="28">🎧</text>
    <rect x="10" y="10" width="55" height="18" rx="4" fill="#ef4444" />
    <text x="37" y="23" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">35% OFF</text>
    <text x="15" y="125" fill="#f8fafc" font-size="12" font-weight="600">Wireless ANC Headphones</text>
    <text x="15" y="142" fill="#94a3b8" font-size="10">Vendor: ElectroTech Gadgets</text>
    <text x="15" y="165" fill="#38bdf8" font-size="14" font-weight="700">₹3,499 <tspan fill="#64748b" font-size="11" text-decoration="line-through">₹5,399</tspan></text>
    <text x="15" y="185" fill="#f59e0b" font-size="11">★★★★★ (4.8)</text>
    <rect x="135" y="162" width="75" height="28" rx="6" fill="#2563eb" />
    <text x="172" y="180" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Add</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(270, 395)">
    <rect x="0" y="0" width="220" height="205" rx="10" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="220" height="100" rx="10" fill="#334155" />
    <text x="110" y="55" text-anchor="middle" fill="#94a3b8" font-size="28">👗</text>
    <rect x="10" y="10" width="55" height="18" rx="4" fill="#ef4444" />
    <text x="37" y="23" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">40% OFF</text>
    <text x="15" y="125" fill="#f8fafc" font-size="12" font-weight="600">Pure Silk Embroidered Saree</text>
    <text x="15" y="142" fill="#94a3b8" font-size="10">Vendor: Fashion Aura</text>
    <text x="15" y="165" fill="#38bdf8" font-size="14" font-weight="700">₹2,499 <tspan fill="#64748b" font-size="11" text-decoration="line-through">₹4,199</tspan></text>
    <text x="15" y="185" fill="#f59e0b" font-size="11">★★★★☆ (4.6)</text>
    <rect x="135" y="162" width="75" height="28" rx="6" fill="#2563eb" />
    <text x="172" y="180" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Add</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(510, 395)">
    <rect x="0" y="0" width="220" height="205" rx="10" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="220" height="100" rx="10" fill="#334155" />
    <text x="110" y="55" text-anchor="middle" fill="#94a3b8" font-size="28">🍳</text>
    <rect x="10" y="10" width="55" height="18" rx="4" fill="#10b981" />
    <text x="37" y="23" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">NEW</text>
    <text x="15" y="125" fill="#f8fafc" font-size="12" font-weight="600">Digital Touch Air Fryer 4.5L</text>
    <text x="15" y="142" fill="#94a3b8" font-size="10">Vendor: Luxe Living</text>
    <text x="15" y="165" fill="#38bdf8" font-size="14" font-weight="700">₹4,299 <tspan fill="#64748b" font-size="11" text-decoration="line-through">₹6,499</tspan></text>
    <text x="15" y="185" fill="#f59e0b" font-size="11">★★★★★ (4.9)</text>
    <rect x="135" y="162" width="75" height="28" rx="6" fill="#2563eb" />
    <text x="172" y="180" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Add</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(750, 395)">
    <rect x="0" y="0" width="220" height="205" rx="10" fill="#1e293b" stroke="#334155" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="220" height="100" rx="10" fill="#334155" />
    <text x="110" y="55" text-anchor="middle" fill="#94a3b8" font-size="28">👟</text>
    <rect x="10" y="10" width="55" height="18" rx="4" fill="#ef4444" />
    <text x="37" y="23" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">28% OFF</text>
    <text x="15" y="125" fill="#f8fafc" font-size="12" font-weight="600">Air Cushion Running Shoes</text>
    <text x="15" y="142" fill="#94a3b8" font-size="10">Vendor: ElectroTech Shoes</text>
    <text x="15" y="165" fill="#38bdf8" font-size="14" font-weight="700">₹1,899 <tspan fill="#64748b" font-size="11" text-decoration="line-through">₹2,699</tspan></text>
    <text x="15" y="185" fill="#f59e0b" font-size="11">★★★★☆ (4.7)</text>
    <rect x="135" y="162" width="75" height="28" rx="6" fill="#2563eb" />
    <text x="172" y="180" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Add</text>
  </g>
</svg>
