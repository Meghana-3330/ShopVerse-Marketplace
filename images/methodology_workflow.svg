<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">SHOPVERSE: THREE-TIER METHODOLOGY &amp; WORKFLOW ARCHITECTURE</text>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Client Presentation Tier ➔ Application Service Tier ➔ Distributed Persistence Tier</text>

  <!-- TIER 1: Presentation Tier -->
  <rect x="40" y="100" width="280" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="100" width="280" height="42" rx="12" fill="url(#gradPrimary)" />
  <text x="180" y="127" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">1. PRESENTATION TIER</text>

  <rect x="60" y="160" width="240" height="70" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
  <text x="180" y="188" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="600">React 18 SPA (Vite 5)</text>
  <text x="180" y="210" text-anchor="middle" fill="#94a3b8" font-size="11">Fast HMR, 2239 Chunks Bundled</text>

  <rect x="60" y="245" width="240" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="180" y="270" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">Client Context State</text>
  <text x="180" y="292" text-anchor="middle" fill="#cbd5e1" font-size="11">• AuthContext (JWT Sessions)</text>
  <text x="180" y="312" text-anchor="middle" fill="#cbd5e1" font-size="11">• CartContext (Multi-Vendor Cart)</text>

  <rect x="60" y="345" width="240" height="95" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="180" y="370" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600">SocketContext Manager</text>
  <text x="180" y="392" text-anchor="middle" fill="#cbd5e1" font-size="11">• Dynamic Host Resolution</text>
  <text x="180" y="412" text-anchor="middle" fill="#cbd5e1" font-size="11">• Auto-Reconnect Engine</text>
  <text x="180" y="430" text-anchor="middle" fill="#cbd5e1" font-size="11">• Web Audio Two-Tone Chime</text>

  <rect x="60" y="455" width="240" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="180" y="480" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="600">Role-Based Interfaces</text>
  <text x="180" y="502" text-anchor="middle" fill="#cbd5e1" font-size="11">Customer • Vendor • Admin</text>
  <text x="180" y="522" text-anchor="middle" fill="#94a3b8" font-size="11">ProtectedRoute Route Guards</text>

  <!-- Connectors Tier 1 -> Tier 2 -->
  <line x1="320" y1="200" x2="360" y2="200" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5,5" />
  <polygon points="360,195 370,200 360,205" fill="#3b82f6" />
  <text x="345" y="185" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="bold">HTTPS</text>

  <line x1="320" y1="390" x2="360" y2="390" stroke="#a78bfa" stroke-width="2.5" />
  <polygon points="360,385 370,390 360,395" fill="#a78bfa" />
  <text x="345" y="378" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="bold">WSS</text>

  <!-- TIER 2: Application Tier -->
  <rect x="370" y="100" width="280" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <rect x="370" y="100" width="280" height="42" rx="12" fill="url(#gradAccent)" />
  <text x="510" y="127" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">2. APPLICATION TIER</text>

  <rect x="390" y="160" width="240" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="510" y="185" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Express.js API Engine</text>
  <text x="510" y="205" text-anchor="middle" fill="#94a3b8" font-size="11">Unified Single-Origin Static Host</text>

  <rect x="390" y="235" width="240" height="80" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="510" y="258" text-anchor="middle" fill="#34d399" font-size="13" font-weight="600">Security &amp; Auth Guards</text>
  <text x="510" y="280" text-anchor="middle" fill="#cbd5e1" font-size="11">• HMAC SHA-256 JWT Verify</text>
  <text x="510" y="300" text-anchor="middle" fill="#cbd5e1" font-size="11">• Privilege Escalation Blocker</text>

  <rect x="390" y="330" width="240" height="95" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="510" y="353" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">Multi-Vendor Cart Engine</text>
  <text x="510" y="375" text-anchor="middle" fill="#cbd5e1" font-size="11">• Server Price Recalculation</text>
  <text x="510" y="395" text-anchor="middle" fill="#cbd5e1" font-size="11">• Atomic Stock Validation</text>
  <text x="510" y="413" text-anchor="middle" fill="#cbd5e1" font-size="11">• Vendor Item Sub-Splitting</text>

  <rect x="390" y="440" width="240" height="100" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="510" y="463" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600">Socket.IO Room Manager</text>
  <text x="510" y="485" text-anchor="middle" fill="#cbd5e1" font-size="11">• `user_${id}`: Buyer Tracking</text>
  <text x="510" y="505" text-anchor="middle" fill="#cbd5e1" font-size="11">• `vendor_${id}`: Store Orders</text>
  <text x="510" y="525" text-anchor="middle" fill="#cbd5e1" font-size="11">• `role_admin`: System Alerts</text>

  <!-- Connectors Tier 2 -> Tier 3 -->
  <line x1="650" y1="280" x2="690" y2="280" stroke="#10b981" stroke-width="2.5" />
  <polygon points="690,275 700,280 690,285" fill="#10b981" />
  <text x="675" y="265" text-anchor="middle" fill="#34d399" font-size="10" font-weight="bold">BSON</text>

  <!-- TIER 3: Data Tier -->
  <rect x="700" y="100" width="260" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <rect x="700" y="100" width="260" height="42" rx="12" fill="url(#gradOrange)" />
  <text x="830" y="127" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">3. DATA TIER</text>

  <rect x="720" y="160" width="220" height="70" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
  <text x="830" y="185" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">MongoDB / Mongoose 8</text>
  <text x="830" y="205" text-anchor="middle" fill="#94a3b8" font-size="11">Indexed Document Store</text>

  <rect x="720" y="245" width="220" height="190" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="830" y="268" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">Collection Schemas</text>
  <text x="830" y="292" text-anchor="middle" fill="#cbd5e1" font-size="11">📂 Users (Customers, Vendors)</text>
  <text x="830" y="316" text-anchor="middle" fill="#cbd5e1" font-size="11">📦 Products (168 Items, 8 Cats)</text>
  <text x="830" y="340" text-anchor="middle" fill="#cbd5e1" font-size="11">📑 Orders (Multi-Vendor Items)</text>
  <text x="830" y="364" text-anchor="middle" fill="#cbd5e1" font-size="11">🏷️ Categories (8 Primary)</text>
  <text x="830" y="388" text-anchor="middle" fill="#cbd5e1" font-size="11">🔔 Notifications (Persistent)</text>
  <text x="830" y="412" text-anchor="middle" fill="#cbd5e1" font-size="11">⭐ Reviews (Verified Purchase)</text>

  <rect x="720" y="450" width="220" height="90" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="830" y="473" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">Embedded Engine Fallback</text>
  <text x="830" y="495" text-anchor="middle" fill="#cbd5e1" font-size="11">• MongoMemoryServer 11</text>
  <text x="830" y="515" text-anchor="middle" fill="#cbd5e1" font-size="11">• Zero-Config Instant Boot</text>
  <text x="830" y="532" text-anchor="middle" fill="#94a3b8" font-size="10">• Auto-Seed 168 Products</text>
</svg>
